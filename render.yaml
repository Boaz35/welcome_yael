# Render Blueprint: Yael Heimer onboarding page (static, no build)
# Deploy: Render Dashboard > New > Blueprint > select this repo
services:
  - type: web
    name: yael-onboarding
    runtime: static
    buildCommand: echo "No build step. Serving index.html as is."
    staticPublishPath: ./
    # PR previews are off: previews.generation is omitted on purpose
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
